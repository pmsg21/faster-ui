name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # pnpm for install (strict dependency graph, no phantom deps),
      # npm CLI for publish (OIDC trusted publishing is only reliable there).
      - name: Pin npm CLI for trusted publishing
        # Pinned, not @latest: OIDC trusted publishing needs npm >= 11.5.1, and
        # npm 11 requires Node >= 22.9.0 (wider than npm 12's ^22.22.2), so it
        # stays compatible even if the Node pin moves. Bump deliberately.
        run: npm install -g npm@11.5.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Changesets opens a "Version Packages" PR when changesets are pending,
      # and publishes when that PR merges. No NPM_TOKEN: auth is OIDC.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-storybook:
    name: Deploy Storybook to Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
      - id: deploy
        uses: actions/deploy-pages@v4
